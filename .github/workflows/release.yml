name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Paket ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-universal
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Pasang GCC (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc zip

      - name: "Kompilasi macOS (universal: Apple Silicon + Intel)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          clang++ -std=c++17 -O2 -DBUILD_WITH_MENU -arch arm64 -arch x86_64 -o tugas_alpro src/*.cpp
          mkdir -p paket && cp tugas_alpro dist/macos/Jalankan.command dist/CATATAN-RILIS.txt README.md LICENSE paket/
          cd paket && zip -r "../alpro-console-tools-${GITHUB_REF_NAME}-${{ matrix.label }}.zip" .

      - name: Kompilasi Linux (libstdc++ statis agar jalan di banyak distro)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++17 -O2 -DBUILD_WITH_MENU -static-libstdc++ -static-libgcc -o tugas_alpro src/*.cpp
          mkdir -p paket && cp tugas_alpro dist/linux/jalankan.sh dist/CATATAN-RILIS.txt README.md LICENSE paket/
          tar -czf "alpro-console-tools-${GITHUB_REF_NAME}-${{ matrix.label }}.tar.gz" -C paket .

      - name: Kompilasi Windows (statis, tanpa ketergantungan DLL MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -DBUILD_WITH_MENU -static -o tugas_alpro.exe src/*.cpp
          mkdir -p paket && cp tugas_alpro.exe dist/windows/Jalankan.bat dist/CATATAN-RILIS.txt README.md LICENSE paket/
          cd paket && zip -r "../alpro-console-tools-${GITHUB_REF_NAME}-${{ matrix.label }}.zip" .

      - name: Unggah ke halaman Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alpro-console-tools-*.zip
            alpro-console-tools-*.tar.gz
          generate_release_notes: true
