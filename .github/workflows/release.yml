name: Release

on:
  push:
    tags: ["v*"]
  # workflow_dispatch berfungsi untuk dry-run jalur rilis (build empat paket + daftar SHA-256) tanpa membuat rilis,
  # dikarenakan tag yang sudah didorong tidak bisa dipindah dan rilis yang terbit tidak bisa diubah; jalankan dengan
  # gh workflow run release.yml --ref <branch> setelah setiap perubahan berkas ini atau pin action yang dipakainya.
  workflow_dispatch:

# Token hanya-baca untuk seluruh workflow; izin tulis diberikan khusus pada job publish di bawah, dikarenakan action
# pihak ketiga di job build (setup-msys2) tidak boleh memegang token yang bisa menulis ke repositori atau rilis.
permissions:
  contents: read

jobs:
  # Tahap 1: tiap OS mengompilasi dan mengunggah paketnya sebagai artifact (tidak langsung menyentuh halaman Release,
  # dikarenakan lima job yang menulis ke satu Release bersamaan membuat catatan rilis tergandakan).
  # Setiap action dipin ke commit SHA penuh (versi ditulis di komentar) dikarenakan tag seperti v2 bisa dipindahkan
  # oleh siapa pun yang menguasai repositori action itu; Dependabot (.github/dependabot.yml) yang memperbarui pin-nya.
  build:
    name: Paket ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-universal
          # Versi Ubuntu dipin sama untuk kedua arsitektur Linux, dikarenakan ubuntu-latest akan berpindah ke 26.04 dan
          # toolchain yang berbeda antar arsitektur bisa memberi peringatan -Werror hanya di salah satunya.
          - os: ubuntu-24.04
            label: linux-x86_64
            arch: x86_64
          # Runner ARM64 GitHub-hosted (gratis untuk repositori publik) berfungsi untuk membangun paket Linux aarch64
          # secara native, dikarenakan kompilasi silang tidak bisa menjalankan uji asapnya sendiri.
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            arch: aarch64
          # Paket Android (Termux) dibangun dengan NDK bawaan runner x86_64 untuk bionic (PIE dinamis dengan interpreter
          # /system/bin/linker64), dikarenakan paket glibc statis mana pun tidak bisa jalan di Termux: termux-exec memuat
          # program lewat linker Android (menolak ET_EXEC, lalu gagal merelokasi static-pie glibc) dan seccomp aplikasi
          # Android menjebak set_robust_list/rseq yang dipanggil glibc saat mulai.
          - os: ubuntu-24.04
            label: android-aarch64
            arch: x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # tidak ada perintah git setelah checkout, jadi token tidak perlu tersimpan di .git/config

      - name: Pasang GCC (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc zip
          cache: false  # cache toolchain ditulis oleh run CI lain; paket rilis tidak boleh bergantung pada isi cache itu

      # Memastikan sumber tidak berubah sejak checkout berfungsi untuk menangkap action yang menulis ke workspace sebelum
      # kompilasi, dikarenakan SHA256SUMS dihitung sesudahnya dan tidak akan mendeteksi perubahan semacam itu.
      - name: Pastikan sumber tidak berubah sejak checkout
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; echo "pohon kerja berubah setelah checkout"; exit 1; fi

      # Nama versi paket diambil dari nama ref dengan garis miring diganti tanda hubung, dikarenakan pada dry-run
      # (workflow_dispatch dari branch seperti fitur/linux-aarch64) nama ref memuat garis miring yang membuat tar/zip
      # mencoba menulis ke folder yang tidak ada; untuk tag (v1.0.6) hasilnya tetap sama persis.
      - name: Tentukan nama versi paket
        shell: bash
        run: echo "PAKET_VERSI=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: "Kompilasi macOS (universal: Apple Silicon + Intel)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          clang++ -std=c++17 -O2 -DBUILD_WITH_MENU -arch arm64 -arch x86_64 -o tugas_alpro src/*.cpp
          mkdir -p paket && cp tugas_alpro README.md LICENSE paket/
          cd paket && zip -r "../alpro-console-tools-${PAKET_VERSI}-${{ matrix.label }}.zip" .

      # Menggunakan -static-pie (tautan statis penuh termasuk glibc, sekaligus position-independent) berfungsi agar paket
      # jalan di distro dengan glibc lebih lama dari runner (Ubuntu 22.04, Debian 12, Alpine, WSL) dan mendapat ASLR,
      # dikarenakan -static-libstdc++ saja masih meminta GLIBC_2.38. Paket ini bukan untuk Android: lihat paket android-aarch64.
      - name: Kompilasi Linux (static-pie agar jalan di banyak distro; x86_64 dan aarch64)
        if: runner.os == 'Linux' && matrix.label != 'android-aarch64'
        shell: bash
        run: |
          # Mencocokkan uname -m dengan matrix.arch berfungsi agar label paket tidak pernah salah pasang, dikarenakan
          # coba.sh memilih paket dari nama arsitekturnya.
          [ "$(uname -m)" = "${{ matrix.arch }}" ] || { echo "runner $(uname -m) tidak cocok dengan label ${{ matrix.label }}"; exit 1; }
          g++ -std=c++17 -O2 -DBUILD_WITH_MENU -static-pie -o tugas_alpro src/*.cpp
          file tugas_alpro
          file tugas_alpro | grep -q -e 'static-pie linked' -e 'statically linked' || { echo "biner Linux tidak statis"; exit 1; }
          # Tipe ELF harus DYN (PIE) tanpa interpreter, persis seperti yang dijanjikan nama paketnya; readelf ada di binutils runner.
          readelf -h tugas_alpro | grep -q 'Type:.*DYN (Position-Independent Executable' || { echo "biner Linux bukan PIE"; exit 1; }
          [ "$(readelf -lW tugas_alpro | grep -c INTERP)" -eq 0 ] || { echo "biner Linux masih butuh interpreter dinamis"; exit 1; }
          out=$(printf '3\n\n2\n14\n\n0\n' | ./tugas_alpro)
          echo "$out" | grep -q "Luas Bangun yang Diarsir : 42.00" || { echo "uji asap paket gagal"; exit 1; }
          mkdir -p paket && cp tugas_alpro README.md LICENSE paket/
          tar -czf "alpro-console-tools-${PAKET_VERSI}-${{ matrix.label }}.tar.gz" -C paket .

      # Kompilasi silang untuk Android dengan clang NDK berfungsi menghasilkan PIE dinamis bionic (interpreter
      # /system/bin/linker64) yang hanya bergantung pada pustaka sistem Android, dikarenakan libc++ ditautkan statis
      # (-static-libstdc++). Runner tidak bisa menjalankan biner Android, jadi di sini hanya ELF-nya yang diperiksa; uji
      # jalan dilakukan di perangkat (Termux) dan dicatat di CHANGELOG.
      - name: Kompilasi Android aarch64 (NDK, bionic; pemeriksaan ELF saja)
        if: matrix.label == 'android-aarch64'
        shell: bash
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME"; [ -d "$ndk" ] || { echo "NDK tidak ada di runner"; exit 1; }
          cxx="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$cxx" --version | head -1
          "$cxx" -std=c++17 -O2 -Wall -Wextra -pedantic -Werror -DBUILD_WITH_MENU -static-libstdc++ -o tugas_alpro src/*.cpp
          file tugas_alpro
          readelf -h tugas_alpro | grep -q 'Type:.*DYN (Position-Independent Executable' || { echo "biner Android bukan PIE"; exit 1; }
          readelf -lW tugas_alpro | grep -q 'interpreter: /system/bin/linker64' || { echo "interpreter bukan linker64 Android"; exit 1; }
          needed=$(readelf -dW tugas_alpro | awk '/NEEDED/ {print $5}' | tr -d '[]' | sort | tr '\n' ' ')
          echo "NEEDED: $needed"
          [ "$(echo "$needed" | grep -c 'libc++_shared')" -eq 0 ] || { echo "masih butuh libc++_shared.so"; exit 1; }
          mkdir -p paket && cp tugas_alpro README.md LICENSE paket/
          tar -czf "alpro-console-tools-${PAKET_VERSI}-${{ matrix.label }}.tar.gz" -C paket .

      - name: Kompilasi Windows (statis, tanpa ketergantungan DLL MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -DBUILD_WITH_MENU -static -o tugas_alpro.exe src/*.cpp
          mkdir -p paket && cp tugas_alpro.exe README.md LICENSE paket/
          cd paket && zip -r "../alpro-console-tools-${PAKET_VERSI}-${{ matrix.label }}.zip" .

      - name: Simpan paket sebagai artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paket-${{ matrix.label }}
          path: |
            alpro-console-tools-*.zip
            alpro-console-tools-*.tar.gz
          if-no-files-found: error

  # Dry-run (workflow_dispatch): job tanpa izin tulis ini mengumpulkan kelima paket dan mencetak daftar SHA-256,
  # dikarenakan download-artifact dan penamaan paket hanya terbukti dengan dijalankan, sedangkan rilis tidak boleh dibuat.
  kumpulkan:
    name: Dry-run (kumpulkan paket, tanpa rilis)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil semua paket
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: paket
          merge-multiple: true

      - name: Buat daftar SHA-256 semua paket (tidak diunggah)
        run: |
          cd paket && sha256sum * > SHA256SUMS && cat SHA256SUMS
          [ "$(ls | wc -l)" -eq 6 ] || { echo "jumlah berkas bukan 6 (5 paket + SHA256SUMS)"; exit 1; }

  # Tahap 2: satu job mengumpulkan kelima paket dan membuat halaman Release sekali, dengan catatan rilis otomatis.
  # Hanya berjalan untuk push tag, dikarenakan dry-run tidak boleh membuat rilis.
  publish:
    name: Terbitkan Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # satu-satunya job yang menulis: membuat rilis dan mengunggah aset
    steps:
      - name: Ambil semua paket
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: paket
          merge-multiple: true

      - name: Buat daftar SHA-256 semua paket
        run: cd paket && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Menggunakan gh CLI bawaan runner berfungsi untuk membuat rilis tanpa action pihak ketiga, dikarenakan job ini
      # satu-satunya pemegang token tulis dan kode pihak ketiga tidak boleh berjalan dengannya. --verify-tag menolak
      # membuat rilis bila tag belum ada di repositori (tag selalu didorong pemilik lebih dulu).
      - name: Unggah ke halaman Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" paket/* --verify-tag --generate-notes
