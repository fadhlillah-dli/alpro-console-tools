name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Tahap 1: tiap OS mengompilasi dan mengunggah paketnya sebagai artifact (tidak langsung menyentuh halaman Release,
  # dikarenakan tiga job yang menulis ke satu Release bersamaan membuat catatan rilis tergandakan).
  build:
    name: Paket ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-universal
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Pasang GCC (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc zip

      - name: "Kompilasi macOS (universal: Apple Silicon + Intel)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          clang++ -std=c++17 -O2 -DBUILD_WITH_MENU -arch arm64 -arch x86_64 -o tugas_alpro src/*.cpp
          mkdir -p paket && cp tugas_alpro dist/macos/Jalankan.command dist/CATATAN-RILIS.txt README.md LICENSE paket/
          cd paket && zip -r "../alpro-console-tools-${GITHUB_REF_NAME}-${{ matrix.label }}.zip" .

      # Menggunakan -static (tautan statis penuh, termasuk glibc) berfungsi agar paket jalan di distro dengan glibc lebih lama
      # dari runner (Ubuntu 22.04, Debian 12, WSL bawaan), dikarenakan -static-libstdc++ saja masih meminta GLIBC_2.38.
      - name: Kompilasi Linux (statis penuh agar jalan di banyak distro)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++17 -O2 -DBUILD_WITH_MENU -static -o tugas_alpro src/*.cpp
          file tugas_alpro | grep -q 'statically linked' || { echo "biner Linux tidak statis"; exit 1; }
          mkdir -p paket && cp tugas_alpro dist/linux/jalankan.sh dist/CATATAN-RILIS.txt README.md LICENSE paket/
          tar -czf "alpro-console-tools-${GITHUB_REF_NAME}-${{ matrix.label }}.tar.gz" -C paket .

      - name: Kompilasi Windows (statis, tanpa ketergantungan DLL MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -DBUILD_WITH_MENU -static -o tugas_alpro.exe src/*.cpp
          mkdir -p paket && cp tugas_alpro.exe dist/windows/Jalankan.bat dist/CATATAN-RILIS.txt README.md LICENSE paket/
          cd paket && zip -r "../alpro-console-tools-${GITHUB_REF_NAME}-${{ matrix.label }}.zip" .

      - name: Simpan paket sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.label }}
          path: |
            alpro-console-tools-*.zip
            alpro-console-tools-*.tar.gz
          if-no-files-found: error

  # Tahap 2: satu job mengumpulkan ketiga paket dan membuat halaman Release sekali, dengan catatan rilis otomatis.
  publish:
    name: Terbitkan Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ambil semua paket
        uses: actions/download-artifact@v4
        with:
          path: paket
          merge-multiple: true

      - name: Buat daftar SHA-256 semua paket
        run: cd paket && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Unggah ke halaman Release
        uses: softprops/action-gh-release@v2
        with:
          files: paket/*
          generate_release_notes: true

      # Memperbarui formula Homebrew di repositori fadhlillah-dli/homebrew-tap agar `brew install` langsung memakai
      # versi ini. Butuh secret HOMEBREW_TAP_TOKEN (fine-grained PAT, izin Contents: write pada homebrew-tap);
      # bila secret belum ada, langkah ini dilewati tanpa menggagalkan rilis. Menggunakan echo "::warning::..." berfungsi
      # untuk menampilkan secret yang belum ada atau tap yang tidak bisa diakses di ringkasan run, dikarenakan rilis
      # tetap hijau dan tanpa itu formula yang basi tidak akan terlihat.
      - name: Peringatan bila secret Homebrew belum ada
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN == ''
        run: echo "::warning::Secret HOMEBREW_TAP_TOKEN belum diset; formula Homebrew tidak diperbarui pada rilis ini."

      - name: Perbarui formula Homebrew
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        # Menggunakan shell: bash berfungsi untuk mengaktifkan pipefail (bash -eo pipefail), dikarenakan tanpa itu unduhan
        # tarball yang gagal tidak menghentikan langkah: sha256 dihitung dari input kosong dan formula yang salah ikut di-push.
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha="$(curl -fsSL "$tarball" | sha256sum | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap \
            || { echo "::warning::Repositori homebrew-tap belum ada atau token tidak berlaku; langkah formula dilewati."; exit 0; }
          mkdir -p tap/Formula
          cat > tap/Formula/alpro-console-tools.rb <<EOF
          class AlproConsoleTools < Formula
            desc "Program konsol C++17 praktikum Alpro: rekap nilai, volume tabung, luas arsir"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "${tarball}"
            sha256 "${sha}"
            license "MIT"

            def install
              system ENV.cxx, "-std=c++17", "-O2", "-DBUILD_WITH_MENU", "-o", "tugas_alpro", *Dir["src/*.cpp"]
              bin.install "tugas_alpro"
            end

            test do
              output = pipe_output("#{bin}/tugas_alpro", "3\n\n2\n14\n\n0\n", 0)
              assert_match "42.00", output
            end
          end
          EOF
          cd tap
          git config user.name "${GITHUB_REPOSITORY_OWNER}"
          git config user.email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          git add Formula/alpro-console-tools.rb
          git commit -m "alpro-console-tools ${version}" || echo "formula tidak berubah"
          git push
