name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # berfungsi agar CI bisa dijalankan manual pada branch mana pun (gh workflow run ci.yml --ref <branch>)

# Token hanya-baca, dikarenakan CI tidak pernah menulis ke repositori; ditulis eksplisit agar tidak bergantung pada setelan
# default repositori. Action dipin ke commit SHA penuh (versi di komentar), diperbarui lewat Dependabot.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm (runner ARM64 GitHub-hosted) berfungsi untuk membuktikan build dan paket statis aarch64,
        # dikarenakan paket rilis Linux kini ada dua arsitektur; versi Ubuntu dipin sama dengan release.yml.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pasang GCC (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Kompilasi tanpa peringatan (macOS dan Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          g++ --version | head -1
          g++ -std=c++17 -Wall -Wextra -pedantic -Werror -DBUILD_WITH_MENU -o tugas_alpro src/*.cpp
          for t in tugas1_nilai_mahasiswa tugas2_volume_tabung tugas3_luas_arsir; do
            g++ -std=c++17 -Wall -Wextra -pedantic -Werror -o "$t" "src/$t.cpp"
          done

      - name: Kompilasi tanpa peringatan (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ --version | head -1
          g++ -std=c++17 -Wall -Wextra -pedantic -Werror -DBUILD_WITH_MENU -o tugas_alpro.exe src/*.cpp
          for t in tugas1_nilai_mahasiswa tugas2_volume_tabung tugas3_luas_arsir; do
            g++ -std=c++17 -Wall -Wextra -pedantic -Werror -o "$t.exe" "src/$t.cpp"
          done

      - name: Uji asap (menu 2, 3, 1, lalu keluar)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out=$(printf '2\n\n2\n2\n14\n10\n\n3\n\n2\n14\n\n1\nAlgoritma dan Pemrograman\n3\nA\n80\nB\n60\nC\n70\n\n0\n' | ./tugas_alpro)
          echo "$out" | grep -q "Volume Tabung         : 1540.00" || { echo "volume salah"; exit 1; }
          echo "$out" | grep -q "Luas Bangun yang Diarsir : 42.00" || { echo "luas arsir salah"; exit 1; }
          echo "$out" | grep -q "Nilai Rata-Rata        70.00" || { echo "rata-rata salah"; exit 1; }
          echo "Uji asap lulus"

      # Tata letak terminal sempit: setiap baris buatan program harus muat di terminal (lebar - 1 kolom) untuk 40-200 kolom,
      # dengan nama beraksara lebar yang dikenali program (CJK, Hangul, huruf lebar penuh, emoji wajah), nama 60 karakter,
      # ukuran terbesar, setiap jenis input salah (skrip validasi PRD 4.2 dan urutan menu 2), dan input yang habis.
      # Setiap kasus dijalankan tanpa warna dan dengan FORCE_COLOR=1, karena baris berwarna bisa dilipat berbeda; kode warna
      # dikupas sebelum diukur. Lebar dibaca program dari COLUMNS karena keluarannya pipa. Lewat pipa ketikan tidak di-echo,
      # jadi prompt di awal baris dipisah ke barisnya sendiri; pemisahan ini tidak bisa menyembunyikan baris yang melebar,
      # karena prompt yang tidak dikenali hanya membuat baris lebih panjang. Setiap kasus wajib memuat teks hasilnya dan
      # jumlah pesan [!] yang persis, supaya kasus yang ketikannya tergeser tidak lolos diam-diam. Cakupannya hanya kasus
      # di daftar ini; stdout dan stderr diukur terpisah. Tanda aksen gabungan juga tidak boleh terpisah dari hurufnya, dan
      # lanjutan nama di tabel harus lurus di kolom nama. Kontrol negatif: gate ini gagal pada v1.0.7.
      - name: Uji tata letak terminal sempit (40-200 kolom)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -I - <<'PY'
          import os, re, subprocess, sys, unicodedata
          ANSI = re.compile(r'\x1b\[[0-9;]*m')
          def width(s):
              return sum(0 if unicodedata.combining(c) else 2 if unicodedata.east_asian_width(c) in 'WF' else 1 for c in s)
          PROMPT = re.compile(r'^(Pilihan Anda {12}: |Pilihan Anda \[0-3\] : |Tekan Enter untuk kembali ke menu\.\.\.|Nama Mata Kuliah : '
                              r'|Jumlah Mahasiswa : |  Nama Lengkap  : |  Nilai \(0-100\) : |Masukkan [^:]*\) +: )')
          def lines_of(text):
              for line in text.split('\n'):
                  m = PROMPT.match(line)
                  while m and len(line) > m.end():
                      yield line[:m.end()]
                      line = line[m.end():]
                      m = PROMPT.match(line)
                  yield line
          K = lambda *xs: '\n'.join(xs) + '\n'
          # (program, ketikan, teks yang wajib muncul, jumlah pesan [!] yang wajib persis[, pola baris yang tidak boleh muncul])
          CASES = [
              ('tugas_alpro', K('2', '', '2', '2', '14', '10', '', '3', '', '2', '14', '', '0'), ['Volume Tabung         : 1540.00', 'Luas Bangun yang Diarsir : 42.00'], 0),
              ('tugas_alpro', K('1', 'Algoritma dan Pemrograman Lanjutan Semester Ganjil', '2',
                                'Muhammad Fadhlillah Abdurrahman Al Ghifari Putra Pratama', '99.5', 'Siti', '100', '', '0'), ['Nilai Rata-Rata'], 0),
              ('tugas_alpro', K('1', '王' * 30, '2', '王小明 李四 张三丰 王五 赵六 孙七 周八 吴九', '90', '한' * 30, '80', '', '0'), ['Nilai Rata-Rata'], 0),
              ('tugas_alpro', K('1', 'Ａ' * 30, '2', 'Ａ' * 30, '70', '😀' * 30, '60', '', '0'), ['Nilai Rata-Rata'], 0),
              ('tugas_alpro', K('1', 'K' * 60, '1', 'N' * 60, '55', '', '0'), ['Nilai Rata-Rata'], 0),
              ('tugas_alpro', K('2', '4', '1', '1', '1000000', '1000000', '', '3', '4', '1', '1000000', '', '0'),
               ['Volume Tabung         : ', 'Luas Bangun yang Diarsir : '], 0),
              # Skrip validasi PRD 4.2: setiap jenis input salah di menu 1 dan 3 (27 penolakan), lalu hasilnya tetap keluar.
              ('tugas_alpro', K('9', 'abc', '2.5', '', '1', '123', '', '.,-', 'X', '0', '1001', '3.0', '-1', 'tiga', '1', '123', '', 'Ayu', '1e2', '+5',
                                '.5', '5.', '101', '-1', '80', '', '3', '0', '9', 'abc', '', '2', '0', '-7', '1e3', '', '14', '', '0'),
               ['Nilai Rata-Rata        80.00', 'Luas Bangun yang Diarsir : 42.00'], 27),
              # Setiap jenis input salah di menu 2 (12 penolakan, empat di antaranya pesan ukuran), lalu hasilnya tetap keluar.
              ('tugas_alpro', K('9', 'abc', '2', 'x', '9', '', 'abc', '3', '', '0', '5', '', '-5', 'abc', '1000001', '14', '0', '10', '', '0'),
               ['Volume Tabung         : 6154.40'], 12),
              ('tugas1_nilai_mahasiswa', K('Pemrograman', '1', '王' * 30, '100'), ['Nilai Rata-Rata'], 0),
              # Nama yang katanya berakhir tepat di batas kolom: lanjutan nama harus lurus di kolom nama (6 spasi setelah garis tepi),
              # bukan bergeser karena spasi pemisahnya terbawa ke baris berikutnya.
              ('tugas1_nilai_mahasiswa', K('Kalkulus', '2', 'A' * 25 + ' ' + 'B' * 10, '50', 'E' * 25 + '  F', '60'), ['Nilai Rata-Rata'], 0,
               [re.compile('^\u2502 {7,}[BF]')]),
              # Nama dengan tanda aksen gabungan (e + U+0301): saat dilipat, aksen tidak boleh terpisah dari hurufnya.
              ('tugas1_nilai_mahasiswa', K('Kalkulus', '1', 'A' + 'e\u0301' * 29, '75'), ['Nilai Rata-Rata'], 0),
              ('tugas2_volume_tabung', K('', '2', '2', '14', '10'), ['Volume Tabung         : 1540.00'], 0),
              ('tugas3_luas_arsir', K('', '2'), ['Input berakhir'], 0),
          ]
          bad = []
          runs = 0
          for color in (False, True):
              env = {k: v for k, v in os.environ.items() if k not in ('NO_COLOR', 'FORCE_COLOR')}
              if color:
                  env['FORCE_COLOR'] = '1'
              for cols in range(40, 201):
                  env['COLUMNS'] = str(cols)
                  for exe, stdin, musts, bangs, *forbidden in CASES:
                      runs += 1
                      r = subprocess.run(['./' + exe], input=stdin.encode(), capture_output=True, env=env, timeout=30)
                      out, err = ANSI.sub('', r.stdout.decode('utf-8')), ANSI.sub('', r.stderr.decode('utf-8'))
                      tag = f'{exe} @{cols}{" warna" if color else ""}'
                      for must in musts:
                          if must not in out + err:
                              bad.append(f'{tag}: keluaran tidak memuat "{must}" (kasus tidak teruji sampai akhir)')
                      if out.count('[!]') != bangs:
                          bad.append(f'{tag}: {out.count("[!]")} pesan [!], harusnya {bangs}')
                      for line in list(lines_of(out)) + err.split('\n'):
                          if width(line) > cols - 1:
                              bad.append(f'{tag}: lebar {width(line)} > {cols - 1}: {line}')
                          if any(unicodedata.combining(c) and (k == 0 or line[k - 1] in ' \u2502') for k, c in enumerate(line)):
                              bad.append(f'{tag}: tanda aksen terpisah dari hurufnya: {line}')
                          for pattern in (forbidden[0] if forbidden else []):
                              if pattern.search(line):
                                  bad.append(f'{tag}: baris tidak boleh berpola {pattern.pattern!r}: {line}')
          for b in bad[:30]:
              print(b)
          print(f'{len(bad)} pelanggaran dari {runs} run')
          sys.exit(1 if bad else 0)
          PY

      # Menguji coba.sh persis seperti pengguna (tanpa tty, jadi masukan lewat stdin) dan memastikan folder sementaranya
      # benar-benar dihapus, dikarenakan janji skrip itu adalah tidak menyisakan berkas apa pun.
      # Di runner ARM, selama rilis terbaru belum memuat paket linux-aarch64, coba.sh harus menolak dengan pesan yang
      # menyebut v1.0.6 dan langkah ini mencatat peringatan; begitu paketnya ada, jalur unduh/verifikasi/ekstraksi aarch64
      # ikut diuji tanpa perlu mengubah berkas ini. Kegagalan lain tetap merah.
      - name: Uji coba.sh (sekali jalan tanpa memasang)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e; out=$(printf '3\n\n2\n14\n\n0\n' | sh coba.sh 2>&1); status=$?; set -e
          if [ "$status" -ne 0 ]; then
            if [ "$(uname -m)" = "aarch64" ] && echo "$out" | grep -q "baru ada sejak v1.0.6"; then
              echo "::warning::rilis terbaru belum memuat paket linux-aarch64; coba.sh menolak dengan pesan yang benar"
            else echo "$out"; echo "coba.sh keluar dengan status $status"; exit 1; fi
          else
            echo "$out" | grep -q "Luas Bangun yang Diarsir : 42.00" || { echo "$out"; echo "luas arsir salah"; exit 1; }
          fi
          # Folder induk sementara dibaca dari mktemp sendiri, dikarenakan di macOS mktemp memakai DARWIN_USER_TEMP_DIR, bukan TMPDIR.
          # Status find diabaikan (|| true), dikarenakan /tmp runner Linux berisi folder pengguna lain yang tidak bisa dimasuki dan
          # pipefail bawaan GitHub akan menggagalkan langkah ini tanpa pesan.
          root=$(dirname "$(mktemp -u)")
          sisa=$({ find "$root" -maxdepth 2 -name tugas_alpro 2>/dev/null || true; } | wc -l)
          [ "$sisa" -eq 0 ] || { echo "folder sementara tidak dihapus ($sisa sisa di $root)"; exit 1; }
          echo "coba.sh OK, tanpa sisa"

      # Membangun biner static-pie persis seperti paket rilis Linux lalu menjalankannya, dikarenakan paket rilis harus jalan
      # di distro dengan glibc lama (ketergantungan glibc hanya hilang bila tautan statis penuh); PIE memberi ASLR.
      - name: Uji biner static-pie (seperti paket rilis Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++17 -O2 -DBUILD_WITH_MENU -static-pie -o tugas_alpro_static src/*.cpp
          file tugas_alpro_static
          file tugas_alpro_static | grep -q -e 'static-pie linked' -e 'statically linked' || { echo "biner tidak statis"; exit 1; }
          readelf -h tugas_alpro_static | grep -q 'Type:.*DYN (Position-Independent Executable' || { echo "biner bukan PIE"; exit 1; }
          [ "$(readelf -lW tugas_alpro_static | grep -c INTERP)" -eq 0 ] || { echo "biner masih butuh interpreter dinamis"; exit 1; }
          printf '3\n\n2\n14\n\n0\n' | ./tugas_alpro_static | grep -q "Luas Bangun yang Diarsir : 42.00" || { echo "luas arsir salah"; exit 1; }
          echo "Biner statis OK"

      # Kompilasi silang untuk Android (bionic) dengan clang NDK bawaan runner x86_64 berfungsi membuktikan sumber bersih
      # -Werror di clang NDK dan ELF-nya PIE dinamis dengan interpreter linker64, dikarenakan runner tidak bisa menjalankan
      # biner Android; uji jalan paket android-aarch64 dilakukan di kontainer bionic sebelum rilis dan di perangkat (Termux).
      - name: Kompilasi Android aarch64 (NDK, pemeriksaan ELF saja)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          [ "$(uname -m)" = "x86_64" ] || { echo "langkah Android memakai toolchain prebuilt/linux-x86_64; runner ini $(uname -m)"; exit 1; }
          ndk="$ANDROID_NDK_LATEST_HOME"; [ -d "$ndk" ] || { echo "NDK tidak ada di runner"; exit 1; }
          grep -h 'Pkg.Revision' "$ndk/source.properties" || true
          cxx="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$cxx" --version | head -1
          "$cxx" -std=c++17 -O2 -Wall -Wextra -pedantic -Werror -DBUILD_WITH_MENU -static-libstdc++ -s -o tugas_alpro_android src/*.cpp
          file tugas_alpro_android
          readelf -h tugas_alpro_android | grep -q 'Type:.*DYN (Position-Independent Executable' || { echo "biner Android bukan PIE"; exit 1; }
          readelf -lW tugas_alpro_android | grep -q 'interpreter: /system/bin/linker64' || { echo "interpreter bukan linker64"; exit 1; }
          needed=$(readelf -dW tugas_alpro_android | awk '/NEEDED/ {print $5}' | tr -d '[]' | sort | tr '\n' ' ')
          [ "$needed" = "libc.so libdl.so libm.so " ] || { echo "NEEDED bukan tepat libc.so libdl.so libm.so: $needed"; exit 1; }
          [ "$(stat -c %s tugas_alpro_android)" -lt 1048576 ] || { echo "biner Android lebih dari 1 MiB"; exit 1; }
          echo "Biner Android OK (ELF, NEEDED: $needed)"

      # Dijalankan di shell MSYS2 dikarenakan biner CI tidak ditautkan statis dan membutuhkan DLL libstdc++ dari PATH MSYS2.
      - name: Uji asap (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          out=$(printf '2\n\n2\n2\n14\n10\n\n3\n\n2\n14\n\n1\nAlgoritma dan Pemrograman\n3\nA\n80\nB\n60\nC\n70\n\n0\n' | ./tugas_alpro.exe)
          echo "$out" | grep -q "Volume Tabung         : 1540.00" || { echo "volume salah"; exit 1; }
          echo "$out" | grep -q "Luas Bangun yang Diarsir : 42.00" || { echo "luas arsir salah"; exit 1; }
          echo "$out" | grep -q "Nilai Rata-Rata        70.00" || { echo "rata-rata salah"; exit 1; }
          echo "Uji asap lulus"

      # Menguji coba.ps1 dalam mode terskrip (ALPRO_INPUT) pada kedua PowerShell dan memastikan folder sementara
      # alpro-coba-* hilang sesudahnya. Jalur interaktif (& $exe, Ctrl+C) hanya bisa diuji manual di Windows sungguhan.
      - name: Uji coba.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && !cancelled()
        shell: powershell
        run: |
          $env:ALPRO_INPUT = Join-Path $env:RUNNER_TEMP 'coba-masuk-51.txt'
          [IO.File]::WriteAllText($env:ALPRO_INPUT, "3`r`n`r`n2`r`n14`r`n`r`n0`r`n")
          $log = (Get-Content -Raw coba.ps1 | Invoke-Expression) *>&1 | Out-String
          Write-Host $log
          if ($log -notmatch 'Luas Bangun yang Diarsir : 42\.00') { throw 'luas arsir salah' }
          if ($log -notmatch 'kode keluar 0\)') { throw 'kode keluar bukan 0' }
          $sisa = @(Get-ChildItem -Path ([IO.Path]::GetTempPath()) -Filter 'alpro-coba-*' -Directory -ErrorAction SilentlyContinue)
          if ($sisa.Count -ne 0) { throw "folder sementara tidak dihapus ($($sisa.Count) sisa)" }
          "coba.ps1 OK, tanpa sisa (PowerShell $($PSVersionTable.PSVersion))"

      - name: Uji coba.ps1 (PowerShell 7)
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $env:ALPRO_INPUT = Join-Path $env:RUNNER_TEMP 'coba-masuk-7.txt'
          [IO.File]::WriteAllText($env:ALPRO_INPUT, "3`r`n`r`n2`r`n14`r`n`r`n0`r`n")
          $log = (Get-Content -Raw coba.ps1 | Invoke-Expression) *>&1 | Out-String
          Write-Host $log
          if ($log -notmatch 'Luas Bangun yang Diarsir : 42\.00') { throw 'luas arsir salah' }
          if ($log -notmatch 'kode keluar 0\)') { throw 'kode keluar bukan 0' }
          $sisa = @(Get-ChildItem -Path ([IO.Path]::GetTempPath()) -Filter 'alpro-coba-*' -Directory -ErrorAction SilentlyContinue)
          if ($sisa.Count -ne 0) { throw "folder sementara tidak dihapus ($($sisa.Count) sisa)" }
          "coba.ps1 OK, tanpa sisa (PowerShell $($PSVersionTable.PSVersion))"
