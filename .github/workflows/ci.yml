name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Pasang GCC (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Kompilasi tanpa peringatan (macOS dan Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          g++ --version | head -1
          g++ -std=c++17 -Wall -Wextra -pedantic -Werror -DBUILD_WITH_MENU -o tugas_alpro src/*.cpp
          for t in tugas1_nilai_mahasiswa tugas2_volume_tabung tugas3_luas_arsir; do
            g++ -std=c++17 -Wall -Wextra -pedantic -Werror -o "$t" "src/$t.cpp"
          done

      - name: Kompilasi tanpa peringatan (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          g++ --version | head -1
          g++ -std=c++17 -Wall -Wextra -pedantic -Werror -DBUILD_WITH_MENU -o tugas_alpro.exe src/*.cpp
          for t in tugas1_nilai_mahasiswa tugas2_volume_tabung tugas3_luas_arsir; do
            g++ -std=c++17 -Wall -Wextra -pedantic -Werror -o "$t.exe" "src/$t.cpp"
          done

      - name: Uji asap (menu 2, 3, 1, lalu keluar)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out=$(printf '2\n\n2\n2\n14\n10\n\n3\n\n2\n14\n\n1\nAlgoritma dan Pemrograman\n3\nA\n80\nB\n60\nC\n70\n\n0\n' | ./tugas_alpro)
          echo "$out" | grep -q "Volume Tabung         : 1540.00" || { echo "volume salah"; exit 1; }
          echo "$out" | grep -q "Luas Bangun yang Diarsir : 42.00" || { echo "luas arsir salah"; exit 1; }
          echo "$out" | grep -q "Nilai Rata-Rata        70.00" || { echo "rata-rata salah"; exit 1; }
          echo "Uji asap lulus"

      # Dijalankan di shell MSYS2 dikarenakan biner CI tidak ditautkan statis dan membutuhkan DLL libstdc++ dari PATH MSYS2.
      - name: Uji asap (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          out=$(printf '2\n\n2\n2\n14\n10\n\n3\n\n2\n14\n\n1\nAlgoritma dan Pemrograman\n3\nA\n80\nB\n60\nC\n70\n\n0\n' | ./tugas_alpro.exe)
          echo "$out" | grep -q "Volume Tabung         : 1540.00" || { echo "volume salah"; exit 1; }
          echo "$out" | grep -q "Luas Bangun yang Diarsir : 42.00" || { echo "luas arsir salah"; exit 1; }
          echo "$out" | grep -q "Nilai Rata-Rata        70.00" || { echo "rata-rata salah"; exit 1; }
          echo "Uji asap lulus"

      # Menguji pemasang satu perintah persis seperti pengguna (irm | iex) pada kedua PowerShell yang ada di Windows,
      # memakai rilis terbaru yang sudah terbit; ALPRO_BIN_DIR mengarahkan pemasangan ke folder sementara runner.
      - name: Uji install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:ALPRO_BIN_DIR = Join-Path $env:RUNNER_TEMP 'alpro-ps51'
          Get-Content -Raw install.ps1 | Invoke-Expression
          $out = "3`n`n2`n14`n`n0`n" | & (Join-Path $env:ALPRO_BIN_DIR 'tugas_alpro.exe')
          if (-not ($out -match 'Luas Bangun yang Diarsir : 42\.00')) { throw 'luas arsir salah' }
          "Uji install.ps1 lulus (PowerShell $($PSVersionTable.PSVersion))"

      - name: Uji install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ALPRO_BIN_DIR = Join-Path $env:RUNNER_TEMP 'alpro-ps7'
          Get-Content -Raw install.ps1 | Invoke-Expression
          $out = "3`n`n2`n14`n`n0`n" | & (Join-Path $env:ALPRO_BIN_DIR 'tugas_alpro.exe')
          if (-not ($out -match 'Luas Bangun yang Diarsir : 42\.00')) { throw 'luas arsir salah' }
          "Uji install.ps1 lulus (PowerShell $($PSVersionTable.PSVersion))"
